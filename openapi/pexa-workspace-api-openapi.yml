        required: false
        schema:
          type: string
      - name: workspaceLastActivityFrom
        in: query
        description: workspaceLastActivityFrom
        required: false
        schema:
          type: string
      - name: workspaceRole
        in: query
        description: workspaceRole
        required: false
        schema:
          type: string
      - name: workspaceStatus
        in: query
        description: workspaceStatus
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
