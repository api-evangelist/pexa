openapi: 3.2.0
info:
  title: Pexa User API
  version: '1.0'
  description: 'Operations tagged User across 2 of this provider''s published API definitions: pexa-exchange-api-legacy-swagger.json, pexa-exchange-api-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/
tags:
- name: User
paths:
  /v1/user:
    get:
      tags:
      - User
      summary: Retrieves user profile
      description: 'This API will return user profile which is belong to logged in user.

        Click here for XSDs.'
      operationId: getUserProfileUsingGET
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.UserProfileRetrievalResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.UserProfileRetrievalResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    servers:
    - url: https://localhost/
  /v3/user:
    get:
      tags:
      - User
      summary: Retrieves user profile
      description: 'This API will return user profile which is belong to logged in user.


        Scopes:

        au_pub_cert_pexa_user_api_v3_read (non-prod)

        au_pub_pexa_user_api_v3_read (prod)'
      operationId: getV3User
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.UserProfileRetrievalResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.UserProfileRetrievalResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      security:
      - oauth2: []
      x-operation-id-source: normalized
      x-operation-id-original: getUserProfileUsingGET
