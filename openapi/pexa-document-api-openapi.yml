      parameters:
      - name: subscriberId
        in: query
        description: subscriberId
        required: false
        schema:
          type: string
      - name: subscriberRole
        in: query
        description: subscriberRole
        required: false
        schema:
          type: string
      - name: workspaceId
        in: query
        description: workspaceId
        required: false
        schema:
