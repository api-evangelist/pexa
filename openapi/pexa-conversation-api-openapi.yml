          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/au.net.pexa.api.schema._1.CreateMessageRequest'
        description: createMessageRequest
        required: true
      security:
      - oauth2: []
      x-operation-id-source: normalized
      x-operation-id-original: postMessageUsingPOST
  /v2/subscriber/conversations:
    get:
      tags:
