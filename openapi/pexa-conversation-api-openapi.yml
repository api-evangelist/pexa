  /v2/workspace/{workspaceId}/conversations:
    get:
      tags:
      - Conversation
      summary: Retrieve Conversations List for a Workspace
      description: 'This API retrieves a list of conversations for a specific workspace.


        Scopes:

        au_pub_cert_pexa_conversation_api_v2_read (non-prod)

        au_pub_pexa_conversation_api_v2_read (prod)'
      operationId: getV2WorkspaceByWorkspaceIdConversations
      parameters:
