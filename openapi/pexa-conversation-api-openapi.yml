openapi: 3.2.0
info:
  title: Pexa Conversation API
  version: '1.0'
  description: 'Operations tagged Conversation across 2 of this provider''s published API definitions: pexa-exchange-api-legacy-swagger.json, pexa-exchange-api-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/
tags:
- name: Conversation
paths:
  /v1/subscriber/conversation/{conversationId}/message:
    post:
      tags:
      - Conversation
      summary: Send a message to an existing conversation
      description: 'This API allows you to send a message to an existing conversation thread.

        Click here for XSDs.'
      operationId: postMessageUsingPOST
      parameters:
      - name: conversationId
        in: path
        description: conversationId
        required: true
        schema:
          type: string
      - name: role
        in: query
        description: role
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.CreateMessageResponse'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/au.net.pexa.api.schema._1.CreateMessageRequest'
        description: createMessageRequest
        required: true
    servers:
    - url: https://localhost/
  /v1/subscriber/conversations:
    get:
      tags:
      - Conversation
      summary: Retrieve Unread Conversations
      description: 'This API retrieves a list of unread conversations.

        Click here for XSDs.'
      operationId: retrieveUnreadConversationsUsingGET
      parameters:
      - name: subscriberId
        in: query
        description: subscriberId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.ConversationsRetrievalResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    servers:
    - url: https://localhost/
  /v1/subscriber/conversations/{conversationId}/markAsRead:
    put:
      tags:
      - Conversation
      summary: Mark as Read the Conversation for a specific Subscriber and Role
      description: This API allows to update/mark as read the conversation for a specific conversation id, subscriber id and role.
      operationId: markConversationAsReadUsingPUT
      parameters:
      - name: conversationId
        in: path
        description: conversationId
        required: true
        schema:
          type: integer
          format: int64
      - name: role
        in: query
        description: role
        required: false
        schema:
          type: string
      - name: subscriberId
        in: query
        description: subscriberId
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    servers:
    - url: https://localhost/
  /v1/workspace/{workspaceId}/conversations:
    get:
      tags:
      - Conversation
      summary: Retrieve Conversations List for a Workspace
      description: This API retrieves a list of conversations for a specific workspace.
      operationId: retrieveConversationsListUsingGET
      parameters:
      - name: role
        in: query
        description: role
        required: false
        schema:
          type: string
      - name: subscriberId
        in: query
        description: subscriberId
        required: false
        schema:
          type: string
      - name: workspaceId
        in: path
        description: workspaceId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.ConversationsRetrievalResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    servers:
    - url: https://localhost/
  /v2/subscriber/conversation/{conversationId}/message:
    post:
      tags:
      - Conversation
      summary: Send a message to an existing conversation
      description: 'This API allows you to send a message to an existing conversation thread.


        Scopes:

        au_pub_cert_pexa_conversation_api_v2_write (non-prod)

        au_pub_pexa_conversation_api_v2_write (prod)'
      operationId: postV2SubscriberConversationByConversationIdMessage
      parameters:
      - name: conversationId
        in: path
        description: conversationId
        required: true
        schema:
          type: string
      - name: role
        in: query
        description: role
        required: false
        schema:
          type: string
      responses:
        '200':
