                    - code: GA.NOTIF.400016
                      message: 'Duplicate eventTypes: ["CHECKLIST_CHECKED", "CHECKLIST_UNCHECKED"]'
                      field: eventTypes
                invalidFormat:
                  summary: Invalid format provided
