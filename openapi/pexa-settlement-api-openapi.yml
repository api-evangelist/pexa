      - name: workspaceId
        in: path
        description: workspaceId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/au.net.pexa.api.schema._1.BalanceDueToEffectSettlementResponse_2'
        '401':
