openapi: 3.2.0
info:
  title: Pexa Health Check API
  version: '1.0'
  description: 'Operations tagged HealthCheck across 3 of this provider''s published API definitions: pexa-exchange-api-legacy-swagger.json, pexa-exchange-api-swagger.json, pexa-plus-marketplace-b2b-api-oas300-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost/
- url: https://plus.pexa.com.au/api/plus/v1
  description: Product server
tags:
- name: Health Check
paths:
  /health:
    get:
      tags:
      - Health Check
      summary: Health Check
      description: This API verifies whether the application is up and running.
      operationId: HealthCheck
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
    servers:
    - url: https://localhost/
  /v2/health:
    get:
      tags:
      - Health Check
      summary: Health Check
      description: 'This API verifies whether the application is up and running.


        Scopes:

        au_pub_cert_pexa_healthcheck_api_v2_read (non-prod)

        au_pub_pexa_healthcheck_api_v2_read (prod)'
      operationId: getV2Health
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      deprecated: false
      security:
      - oauth2: []
      x-operation-id-source: normalized
      x-operation-id-original: HealthCheck
components:
  schemas:
    Errors:
      description: List of errors related to the API
      type: object
      properties:
        errors:
          description: Errors returned by the service
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/Error'
    Error:
      description: Detailed error related to the API
      type: object
      properties:
        code:
          description: The error code
          type: string
          example: PL.TITSE.001
        message:
          description: Human-readable description of the error for debugging purposes
          type: string
          example: The land title reference provided is invalid for the jurisdiction.
        field:
          description: Name of the field provided in the original request (if any) that the error pertains to
          type: string
          example: landTitleReference
  parameters:
    SubscriberId:
      description: Subscriber id
      in: header
      name: X-Pexa-Subscriber-ID
      required: true
      schema:
        type: integer
        example: 12345
  responses:
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - code: '500001'
              message: An internal error has occurred
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          scopes:
            au_pub_pexa_healthcheck_api_v2_read: Health check read access
            au_pub_pexa_landtitle_api_v2_read: Land title read access
            au_pub_pexa_conversation_api_v2_read: Conversation read access
            au_pub_pexa_conversation_api_v2_write: Conversation write access
            au_pub_pexa_invitation_api_v2_read: Invitation read access
            au_pub_pexa_invitation_api_v2_write: Invitation write access
            au_pub_pexa_subscriber_api_v3_read: Subscriber v3 read access
            au_pub_pexa_subscriber_api_v4_read: Subscriber v4 read access
            au_pub_pexa_user_api_v3_read: User profile read access
            au_pub_pexa_workspace_api_v4_write: Workspace v4 write access
            au_pub_pexa_workspace_api_v5_read: Workspace v5 read access
            au_pub_pexa_workspace_api_v5_write: Workspace v5 write access
            au_pub_pexa_workspace_api_v6_read: Workspace v6 read access
            au_pub_pexa_documents_api_v2_read: Documents read access
            au_pub_pexa_documents_api_v2_write: Documents write access
            au_pub_pexa_financial_settlement_schedule_api_v2_read: Financial settlement schedule read access
            au_pub_pexa_financial_settlement_schedule_api_v2_write: Financial settlement schedule write access
            au_pub_pexa_settlement_api_v2_read: Settlement read access
            au_pub_pexa_settlement_api_v2_write: Settlement write access
            au_pub_pexa_settlementcompletionrecord_api_v2_read: Settlement completion record read access
          authorizationUrl: https://auth.pexa.com.au/oauth/authorize
          tokenUrl: https://auth.pexa.com.au/oauth/token
