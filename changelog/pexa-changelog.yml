note: >-
  PEXA publishes a per-product, dated changelog inside the developer portal. The portal states the
  format is based on Keep a Changelog and that the APIs adhere to Semantic Versioning, but the release
  identifiers in practice are PEXA platform release trains (R.<major>.<minor>.<patch>) with a calendar
  month rather than semver tags on the API itself. The Exchange changelog runs back to 2019; only the
  recent window is captured here — the live changelog is the source of truth. The portal also notes
  that the OpenAPI spec for a particular release can be downloaded from the CHANGELOG menu.
