apis:
- aid: pexa:pexa-exchange-api
  name: PEXA Exchange API
  description: >-
    The PEXA Exchange API covers key facets of PEXA Exchange e-conveyancing functionality — creating and
    updating workspaces, invitations, participants, land title references, documents, conversations, financial
    settlement line items, settlement dates and settlement completion records. Documented as a Swagger
    2.0 contract across versioned paths (/v2 through /v6). Authenticated with OAuth 2.0 (client credentials
    or authorization code) or mutual TLS; each endpoint requires specific scopes. Access requires a signed
    PEXA API Agreement.
  humanURL: https://developer.pexa.com.au/Exchange/api/apireference/
  baseURL: https://api.pexa.com.au
