aid: pexa
url: https://raw.githubusercontent.com/api-evangelist/pexa/refs/heads/main/apis.yml
name: PEXA
kind: company
description: 'PEXA (Property Exchange Australia) operates Australia''s dominant Electronic Lodgement Network
  (ELN), the digital rail on which property is settled and title dealings are lodged with the state land
  registries. Where the Australian real estate value chain splits into a listings duopoly (REA Group and
  Domain) sitting over progressively privatised state land registries, PEXA occupies the transaction layer
  underneath both — electronic conveyancing, settlement funds movement, digital signing and lodgement
  — and e-conveyancing is now effectively mandated for most dealings in most Australian jurisdictions,
  making PEXA the closest thing in the property sector to a required, national, machine-readable rail.
  Its API posture is correspondingly unusual: PEXA publishes a genuine developer portal at developer.pexa.com.au
  with Swagger UI reference documentation and machine-readable OpenAPI/Swagger contracts for the Exchange,
  Projects, Notification (webhooks), Standalone Discharge and PEXA Plus Marketplace APIs, and the ARNECC
  Model Operating Requirements oblige it to offer API access to third parties on an equivalent basis.
  But that surface is not self-serve: PEXA states plainly that access to the Developer Portal and to test
  or production credentials is contingent on having signed PEXA''s API Agreement, so a developer registers
  via a form, is validated and approved, signs an agreement, and is then issued OAuth 2.0 client credentials
  (or mutual TLS). RESO is absent — it is a North American MLS standard with no bearing on Australian
  e-conveyancing — so there is no RESO Web API or Data Dictionary certification here, and none should
  be expected. This is a well-documented, regulated, licensed-access API estate rather than an open one.'
