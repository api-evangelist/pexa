    url: openapi/pexa-plus-marketplace-b2b-api-openapi.yaml
  - type: OpenAPI
    url: openapi/pexa-plus-marketplace-b2b-api-oas300-openapi.yaml
  - type: APIReference
    url: https://developer.pexa.com.au/Marketplace/api/apireference/
