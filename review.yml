  probeCaveat: >-
    developer.pexa.com.au is a single-page application with a catch-all that returns
    the 576,556-byte index HTML with content-type text/html and HTTP 200 for ANY
    unknown path — including /openapi.json, /swagger.json, /robots.txt and
    /sitemap.xml. Those 200s are therefore NOT real artifacts and none was treated
    as one. Real artifacts were located instead via the Gatsby build: the webpack
    runtime chunk map exposed the portal's page components, and the per-route
    page-data JSON exposed the GraphQL allFile nodes with their /static/<hash>/
    publicURL paths, each of which was then fetched and parsed.

