negativeFindings:
  - No RESO Web API certification, no RESO Data Dictionary certification, no RESO
    directory listing, no OData service root and no $metadata document. RESO is
    absent from this market, not merely unreached.
  - No self-serve developer signup anywhere. The portal build explicitly sets
    hideSignUp true on its authenticated page components.
  - No public SDKs and no downloadable Postman collection found.
  - github.com/pexa returned HTTP 200 but resolves to "Pexa, Inc." — a DIFFERENT
    organisation, not Property Exchange Australia. Deliberately NOT recorded as a
    PEXA GitHub organisation.
  - No open, unlicensed dataset. Nothing PEXA publishes is callable without a signed
    agreement.
  - developers.pexa.com.au and docs.pexa.com.au do not resolve.

actions:
  apisYmlCreated: true
  apisListed: 5
  specsSaved: 7
  readmeCreated: true
  reason: >-
    A genuine, documented, machine-readable API estate was captured with full
    provenance, alongside an explicit record that reachability is governed by a
    signed API Agreement rather than by any certification, and that RESO does not
    apply in the Australian market.
