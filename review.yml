    /EXP_ConsolidatedDischarge/api/apireference/. Their GraphQL allFile nodes
    yielded 9 distinct spec publicURLs, each fetched anonymously at HTTP 200 on
    2026-07-26 and parsed with PyYAML / json before being saved verbatim.
