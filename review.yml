aid: pexa
name: PEXA
review:
  question: Does PEXA expose a real, reachable public API surface, and what does a
    developer actually have to sign or join to call it?
  answer: true
  date: '2026-07-26'
  reviewer: API Evangelist
  tier: mls-data-infrastructure
  homeMarket: Australia
  primaryDomain: pexa.com.au

sectorPosture:
  homeMarket: Australia
  resoPosture: >-
    No RESO reference found. RESO (Real Estate Standards Organization) is a North
    American MLS standard promulgated by NAR; it has no bearing on Australian
    electronic conveyancing and PEXA neither claims nor implies any RESO alignment.
    A word-boundary grep for "RESO", "OData", "$metadata", "MLS", "IDX", "Data
    Dictionary" and "Universal Property Identifier" across every harvested PEXA
    contract (7 specs, ~940KB), the pexa.com.au homepage and the pexa.com.au API
    integration page returned ZERO hits. No /$metadata document, no OData service
    root, and no RESO certification directory listing applies. PEXA's machine-readable
    contract is plain OpenAPI/Swagger over REST, not RESO Web API.
  resoCertified: false
  resoCertificationType: none
  resoDataDictionaryVersion: null
  resoDirectoryEvidence: >-
    Not applicable. PEXA is not an MLS, board or association and does not appear in
    the RESO certification directory. Australia has no RESO-equivalent mandate;
    its machine-readable property mandate is regulatory (ARNECC) rather than
    industry-standards-body driven.

  accessGate: licence-agreement
  accessGateEvidence: >-
    Verbatim from https://www.pexa.com.au/api-pricing/ (HTTP 200, fetched
    2026-07-26): "PEXA Exchange APIs are documented in the PEXA Developer Portal.
    Access to the Developer Portal and credentials to test and productionise APIs
    is contingent upon having signed PEXA's API Agreement." The same page states
    that agreements fall broadly into two types — Subscribers using PEXA Exchange
    APIs for their own conveyancing transactions ("own use"), and Intermediary
    Service Providers (subscribers or software providers) providing a platform or
    service to other subscribers ("3rd party use"), where each subscriber must give
    consent for PEXA to share their workspace data with the Intermediary Service
    Provider. The step-by-step onboarding on https://www.pexa.com.au/pexa-apis/
    (HTTP 200) is: (1) REGISTER FOR DEVELOPER PORTAL — "Fill out the form below and
    we'll validate your details"; (2) GET TEST ACCESS — "Once validated and
    approved, we'll email your test access details"; (3) PLAN & DESIGN; (4) BUILD &
    TEST; (5) PRODUCTION READINESS; (6) GO LIVE. The Exchange and Projects
    documentation both state: "If you require new credentials, please email
    apisupport@pexa.com.au with your company and contact information... For the
    production environment, PEXA will work with you to get you onboarded."
  whatADeveloperMustSignOrJoin: >-
    A signed PEXA API Agreement (own-use or Intermediary Service Provider variant),
    preceded by a registration form on pexa.com.au/pexa-apis/ that PEXA validates
    and approves, followed by an emailed credential issuance from
    apisupport@pexa.com.au. There is no self-serve signup — the developer portal
    build explicitly disables sign-up (the Swagger UI page components are wrapped in
    an auth HOC with hideSignUp set to true, and the portal's CSP allows only
    cognito-idp.ap-southeast-2.amazonaws.com for identity). Practical use also
    presumes PEXA Subscriber status or a relationship with one, since Exchange
    workspaces belong to subscribers.
  regulatoryNote: >-
    PEXA's API access is regulated, not merely commercial. Per
    https://www.pexa.com.au/api-pricing/: "In line with the Model Operating
    Requirements which are set and governed by ARNECC, PEXA Exchange APIs are
    available to all third parties for integration on an equivalent basis to other
    parties of the same type, level or class" with respect to technical
    availability, permitted purpose, use, fees, and access processes. This is the
    sector's clearest example of a mandated non-discriminatory API access
    obligation — it does NOT make the API open, it makes the gate obligatorily
    even-handed.
  openData: false
  openDataEvidence: >-
    No open, unlicensed, publicly callable PEXA dataset exists. Every documented
    endpoint sits behind OAuth 2.0 or mutual TLS and a signed agreement. PEXA is
    private national infrastructure over the state land registries, not a
    government open-data publisher; Australian open property data, where it exists,
    comes from state land registries and data.gov.au, not from PEXA.
  authModel: >-
    OAuth 2.0 — clientCredentials (machine-to-machine) and authorizationCode (B2C,
    individual PEXA login plus MFA) — OR mutual TLS. From
    https://www.pexa.com.au/pexa-apis/: "We authenticate our APIs using industry
    best practices, either through OAuth2.0 or Mutual TLS." Production token
    endpoint https://auth.pexa.com.au/oauth/token; test token endpoint
    https://auth-tst.pexalabs.com.au/oauth/token. Access tokens expire after 12
    hours. Anonymous OIDC discovery IS served:
    https://auth.pexa.com.au/.well-known/openid-configuration returned HTTP 200
    (issuer https://auth.pexa.com.au/, authorization_endpoint /authorize, token
    /oauth/token, jwks_uri /.well-known/jwks.json, registration_endpoint
    /oidc/register, device_authorization_endpoint /oauth/device/code;
    grant_types_supported includes client_credentials, authorization_code,
    refresh_token; token_endpoint_auth_methods_supported includes private_key_jwt;
    an Auth0-shaped deployment).
    https://auth.pexa.com.au/.well-known/oauth-authorization-server also returned
    HTTP 200. https://api.pexa.com.au/.well-known/openid-configuration returned 404.
    Real per-endpoint scopes are declared in the harvested contracts, e.g.
    view:notification_registrations, create:notification_registrations,
    edit:notification_registrations, delete:notification_registrations,
    create:notification_registrations_secret_rotation (Notification Service), and
    au:projects:project:write / au_pub_tst_pexa_conversation_api_v2_read cited in
    the documentation.
  sandbox: true
  sandboxEvidence: >-
    A fully managed test environment is documented and named: api-tst.pexalabs.com.au
    (API host) and auth-tst.pexalabs.com.au (token host), with worked cURL examples
    in both the Exchange and Projects documentation. pexa.com.au/pexa-apis/ states
    "We offer a fully-managed test environment where you can connect, develop and
    make sure everything works." Test credentials are issued only after the
    registration form is validated and approved. Anonymous GET
    https://api-tst.pexalabs.com.au/ returned 404 (host resolves, root not served).
  coverage: >-
    National Australian coverage rather than MLS/board coverage — PEXA operates as
    an Electronic Lodgement Network Operator across Australian jurisdictions (VIC,
    NSW, QLD, ACT, SA, NT, WA and, per the homepage, now live in TAS), integrating
    with the state land registries and financial institutions. This is transaction
    and title infrastructure, not listings distribution; there is no MLS or board
    concept in this market.
  documentationPublic: partial
  documentationPublicNote: >-
    The developer portal at https://developer.pexa.com.au/ returns HTTP 200
    anonymously and is a Gatsby 5.16.1 single-page application ("pexa-documentation-
    portal") that renders Swagger UI. Its interactive API reference pages are
    login-gated (AWS Cognito) and Try-It-Out is disabled in code
    (allowTryItOutFor returns false). However, the static build artifacts are served
    unauthenticated: the Gatsby page-data JSON and the /static/<hash>/ spec files
    were all retrieved anonymously at HTTP 200, which is how the contracts below
    were harvested. So the CONTRACTS are effectively public while the PORTAL and the
    CREDENTIALS are not — certification-style reachability is not the issue here;
    the agreement is.
  sdks: none-found
  postman: >-
    No downloadable Postman collection was found. The Exchange and Projects
    documentation contain "Postman:" labels next to worked examples, but these are
    screenshots/illustrations, not collection downloads.
  webhooks: true
  webhooksNote: >-
    Genuine outbound webhooks exist and are contractually declared. The OpenAPI
    3.1.0 Notification Service document declares a top-level webhooks block with
    SubscriberNotification and NonSubscriberNotification, plus registration
    management endpoints and a shared-secret rotation endpoint. PEXA documents it as
    a premium billed API (contact apisupport@pexa.com.au).
  pricingPublic: true
  pricingNote: >-
    API pricing is publicly published at https://www.pexa.com.au/api-pricing/ and is
    metered per "Settled Workspace": Heritage (legacy) APIs free of charge for
    select permitted purposes; own-use paid APIs $2 per Settled Workspace;
    Intermediary Service Provider paid APIs $1 per Settled Workspace; all exclusive
    of GST, charged separately per permitted purpose.

findings:
  summary: |
    PEXA is the strongest counter-example in this sector to the assumption that a
    gated market means an absent API. It publishes a real, versioned, multi-product
    API estate with machine-readable contracts, a named test environment, published
    per-transaction pricing, declared OAuth scopes, and real outbound webhooks — and
    it is obliged by the ARNECC Model Operating Requirements to make that access
    available to third parties on an equivalent basis. What it does not do is let
    anyone in: portal access and credentials both require a signed PEXA API
    Agreement, sign-up is disabled in the portal build, and credentials are issued
    by email after PEXA validates and approves a registration form.

    RESO is simply not part of this picture, and that is the honest finding rather
    than a gap: RESO is a North American MLS data standard and Australia's
    machine-readable property mandate runs through e-conveyancing regulation
    (ARNECC / the Electronic Conveyancing National Law) instead. Seven real
    contracts were harvested and every one parses.
