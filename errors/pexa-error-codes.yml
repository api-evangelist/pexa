  message: The revenue office transaction ID cannot be updated based on the jurisdiction of the workspace.
  cause: Within your Manage Transfer Duty Data API request you are trying to modify the value of the RevenueOfficeTransactionId
    field (add/update) for a workspace in a jurisdiction that does not support the 'data matching' OSR model - e.g.
    the workspace must be in the jurisdiction of NSW, WA or SA.
  remediation: Ensure that the workspace is a jurisdiction (NSW, WA or SA) where the Practitioner must prepare a
    stamp duty assessment in the OSR duties system and then obtain an OSR Transaction ID (prior to settlement).
notification_errors:
- code: GA.NOTIF.400000
  message: 'Invalid UUID string: 123'
  cause: The UUID string you have included in your response or path parameter is not valid.
  remediation: Please ensure this UUID is valid or in the correct format eg. 091f7d22-88a9-4b64-bc51-e1ea8bb8dc42
- code: GA.NOTIF.400009
  message: Subscriber Id is missing
  cause: We couldn’t retrieve the subscriber ID from the provided token.
  remediation: Please check the token includes the correct subscriberId, if you are still having issues please contact
    the PEXA API support team here
- code: GA.NOTIF.400012
  message: Webhook URI is invalid
  cause: The provided Webhook URI is invalid.
  remediation: Please verify that the Webhook URI is a valid URL.
- code: GA.NOTIF.400013
  message: Event type list is empty
  cause: The list of event types is empty.
  remediation: Please review the full Event Catalogue on the developer portal and ensure that you include at least
    one event type in your payload.
- code: GA.NOTIF.400014
  message: Domain not whitelisted
  cause: The webhook domain has not been whitelisted.
  remediation: Please ensure your domain is whitelisted with PEXA. If you have any queries please contact the API
    support team here
- code: GA.NOTIF.400015
  message: Event type list is invalid
  cause: The request includes list of event types that are invalid.
  remediation: Please review and correct the event type list in your payload.
- code: GA.NOTIF.400016
  message: Event type list has duplicates
  cause: The request includes duplicate eventTypes.
  remediation: Please check your request and remove any duplicate event types.
- code: GA.NOTIF.400017
  message: Invalid format provided
  cause: The format provided is invalid.
  remediation: Please ensure that the data format matches the expected format specified in the API documentation.
    Double-check the structure and data types of your payload.
- code: GA.NOTIF.400018
  message: Invalid JSON
  cause: There was an error parsing your JSON payload.
  remediation: Please verify that your JSON payload is correctly formatted. Check for common issues like missing
    commas, brackets, or quotation marks.
- code: GA.NOTIF.400019
  message: Duplicate registration
  cause: A registration with this combination already exists.
  remediation: Please review your submission to ensure the registration details are unique. Check for any existing
    registrations with the same information and modify your submission if necessary. If you need further assistance,
    please contact the PEXA API support team here
- code: GA.NOTIF.401004
  message: Unauthorized
  cause: You are not authorized to use the API endpoint. Please check that you have a valid token.
  remediation: Please check that the access token is valid. Otherwise please call the identity provider API to get
    a new token with the right access.
- code: GA.NOTIF.403003
  message: Forbidden
  cause: You have used a valid access token but don’t have access to call this API endpoint.
  remediation: Please check that you have included the right scopes to access this API endpoint. If you are still
    having issues please contact the PEXA API support team here
- code: GA.NOTIF.404007
  message: 'Registration not found for given id: 091f7d22-88a9-4b64-bc51-e1ea8bb8dc42'
  cause: We cannot update, delete or rotate shared secret for the registration provided because the id is not found.
  remediation: Please check you have provided the correct registrationId that was returned when you created the
    registration.
- code: GA.NOTIF.400020
  message: 'Mandatory event types are missing: [\"SECRET_EXPIRY\"]'
  cause: When creating a registration you have not included the SECRET_EXPIRY event which is mandatory. You need
    need to have this event which will send notifications to you about secret expiry and the need to rotate your
    secret.
  remediation: Please add "SECRET_EXPIRY" event along with one business event as minimum for any new registration.
- code: GA.NOTIF.400021
  message: There should be at least one more event present apart from mandatory event(s)
  cause: When creating a registration you have not included at least one business event other than the mandatory
    SECRET_EXPIRY event
  remediation: Please look over the list of business events in the PEXA Webhook Event Catalogue and add at least
    one event to your registration eg. "WORKSPACE_ROLE_ADDED"
