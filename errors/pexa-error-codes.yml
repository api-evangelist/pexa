exchange_exceptions:
- code: OB1400.005
  message: The search subscriber Id and subscriber name must not be provided together
  cause: You have provided values for both the subscriber ID and subscriber name fields within the Subscriber Search
    API request.
  remediation: Re-try your Subscriber Search API request by providing a single value only to one of the fields.
    Either fill a value for the subscriber ID or the subscriber name field as per your preference.
- code: OB1400.006
  message: The search subscriber Id or subscriber name must be provided
  cause: You have not provided a value either for subscriber ID or the subscriber name fields within_ your Subscriber
    Search API request.
  remediation: In your Subscriber Search API request add a value for at least one of the fields. You must provide
    a value for the subscriber ID or the subscriber name field to support your search.
- code: OB1401.006
  message: The land title already exists in the PEXA workspace
  cause: The land title used within your Land Title Reference Verification API request already exists within another
    PEXA workspace.
  remediation: If you would like to check a land title that does not exist within another PEXA workspace, please
    try again by adding a new value within the land title field to your Land Title Reference Verification API request.
- code: OB1401.007
  message: The land title was not found in PEXA
  cause: The land title used within your Land Title Reference Verification API request does not exist within the
    PEXA test environment.
  remediation: Try again by adding a land title to your Land Title Reference Verification API request that was provided
    by the PEXA API Services team to support your testing.
- code: OB1402.001
  message: The land title reference is not eligible for Electronic Lodgement
  cause: The land title within your Initiate Workspace Creation API request is valid but not eligible for electronic
    lodgement in PEXA and will need to be completed in paper.
  remediation: Try again by adding a land title to your Initiate Workspace Creation API request that is eligible
    for lodgement. This would have been provided to you by the PEXA API team to support your testing.
- code: OB1402.002
  message: The financial settlement field must be set to 'No' for the role selected
  cause: You have used the role of 'Consentor' or 'CT Controller' and have set the value for the financial settlement
    field to 'Yes' within your Initiate Workspace Creation API request
  remediation: Try again with the same role and update the value within the financial settlement field to 'No'.
- code: OB1402.003
  message: The settlement date must not be populated if financial settlement is not required
  cause: You have added a financial settlement date and provided a value of 'No' to the financial settlement field
    within your Initiate Workspace Creation API request.
  remediation: If you do not require settlement in your workspace, remove the financial settlement date field and
    keep the value of the financial settlement field as 'No' within your Initiate Workspace Creation API request.
    If settlement is required, ensure the financial settlement date field remains populated and update the value
    for the financial settlement field to 'Yes'.
- code: OB1402.004
  message: The settlement date must be populated if financial settlement is required
  cause: You have not provided a value for the settlement date field and have kept the value for the financial settlement
    field as 'Yes' within your Initiate Workspace Creation API.
  remediation: If settlement is required, within your Initiate Workspace Creation API request ensure the financial
    settlement date field remains populated and update the value for the financial settlement field to 'Yes'.
- code: OB1402.005
  message: The settlement date cannot be prior to current date
  cause: You have provided a settlement date that is in the past within your Initiate Workspace Creation API request.
  remediation: Within your Initiate Workspace Creation API request, add a settlement date value that is in the future
    and is not greater than 6 months from the today.
- code: OB1402.006
  message: The parent title field must be 'No' if financial settlement is not required
  cause: You have provided a value of 'No' for the financial settlement field and have set the value for parent
    title to 'Yes' within your Initiate Workspace Creation API request.
  remediation: If financial settlement is not required, set the value for both the parent title field and the financial
    settlement field to 'No' within your Initiate Workspace Creation API request.
- code: OB1402.007
  message: The request for land title data field must be 'No' for the role selected
  cause: Within your Initiate Workspace Creation API request your role is either 'Consentor' or 'CT Controller'
    and the value for the request land title data field is set to 'Yes'.
  remediation: Set the value for the request land title data field to 'No' within your Initiate Workspace Creation
    API request.
- code: OB1402.008
  message: The request for land title data field must be 'No' if parent land titles exist
  cause: Within your Initiate Workspace Creation API request, the value for the parent title field is 'Yes' and
    the request land title data field is 'Yes'.
  remediation: Within your Initiate Workspace Creation API request, the value for the land title data field must
    be set to 'No' if the value for the parent title field is 'Yes'.
- code: OB1402.018
  message: The request contains a duplicate land title reference
  cause: 'Within your Initiate Workspace Creation API request you can add up to 20 land titles and you have entered
    a duplicate land title . Example: <LandTitleReference>11234</LandTitleReference> <LandTitleReference>55678</LandTitleReference>
    <LandTitleReference>91011</LandTitleReference> <LandTitleReference>11234</LandTitleReference>'
  remediation: Within your Initiate Workspace Creation API request remove the duplicate land title .
- code: OB1402.019
  message: The workspace must not exceed 20 land titles
  cause: You have exceeded the maximum number of land titles (20 land titles for a workspace) within your Initiate
    Workspace Creation API request
  remediation: Reduce the number of land title values within your Initiate Workspace Creation API request and ensure
    you do not exceed 20 land title values.
- code: OB193.001
  message: Financial Settlement cannot be executed on this day as it is a non-business day
  cause: 'You have provided a value for the settlement date field within your Initiate Workspace Creation API request
    which is either a weekend of a public holiday. Example: <SettlementDate>2018-12-25</SettlementDate>'
  remediation: Ensure that the value for the settlement date field within your Initiate Workspace Creation API request
    is not a weekend, or a public holiday. A list of public holidays can be found here .
- code: OB193.002
  message: The Financial Settlement Date cannot be greater than 6 months in the future.
  cause: You have provided a value for the settlement date field within your Initiate Workspace Creation API request
    that is greater than 6 months in the future.
  remediation: Amend the value for the settlement date field within your Initiate Workspace Creation API request
    so that the value does not exceed 6 months in the future.
- code: OB1402.023
  message: The parent title field must be 'No' for the role selected
  cause: You have used the role of 'Consentor' or 'CT Controller' and have set the value for the parent title field
    to 'Yes' within your Initiate Workspace Creation API request
  remediation: Set the value for the parent title field to 'No' within your Initiate Workspace Creation API request.
- code: OB1402.029
  message: The Subscriber is not active in the jurisdiction of the workspace
  cause: You are trying to create a workspace through the Initiate Workspace Creation API request in a jurisdiction
    that you are not licensed to operate in.
  remediation: Check the value for the jurisdiction field within your Initiate Workspace Creation API request and
    amend it to the state that you are licensed to operate in.
- code: OB1402.030
  message: The role is invalid for the jurisdiction and/or the subscriber type
  cause: You are trying to create a workspace through the Initiate Workspace Creation API request using a role that
    is not valid for the jurisdiction you are trying to create the workspace for.
  remediation: Within your Initiate Workspace Creation API request, update the value for the role field to ensure
    that it is valid for the value put in the jurisdiction field or vice versa. Have a look at the valid values
    for Roles or Jurisdictions that can be used within your API request.
- code: OB1402.031
  message: The party cannot be added to the workspace when the request for land title data is 'No' and parent title
    indicator is 'No'
  cause: Within the Initiate Workspace Creation API request a party record has been provided and both the value
    for the parent title field and request for land title data field is set to 'No'.
  remediation: Within the Initiate Workspace Creation API request where a party record has been provided, both the
    values for the parent title field and request for land title data field needs to be set to 'Yes'.
- code: OB1402.033
  message: The party in the specified role cannot be created when there is a parent land title
  cause: Within the Initiate Workspace Creation API request, Parent Title = 'Yes', Party Details is provided, Representing
    Party = 'Yes' and Party Role <> 'Incoming Proprietor' OR Within the Initiate Workspace Update API request, Party
    Details is provided with Party Action Type = 'Create', Representing Party = 'Yes', Party Role <> 'Incoming Proprietor'
    and the Workspace which is being updated by the API has a Parent Land Title.
  remediation: Within the Initiate Workspace Creation API request; * set Parent Title = 'Yes' * provide Party Details
    * set Representing Party = 'Yes' * set Party Role = 'Incoming Proprietor' OR Within the Initiate Workspace Update
    API request for a workspace that has a Parent Land Title, * Provide Party Details * set Party Action Type =
    'Create' * set Representing Party = 'Yes' * set Party Role = 'Incoming Proprietor'
- code: OB1402.039
  message: The date of birth must not be provided when creating the incoming proprietor party
  cause: Within your Initiate Workspace Creation API request you are acting in the role of 'Proprietor on Title'
    and you have created a party for the 'Incoming Proprietor' and you have added a date of birth for the party.
  remediation: As a Proprietor on Title you are unable to add a date of birth when creating a party for the Incoming
    Proprietor. Within your Initiate Workspace Creation API request you need to remove the date of birth provided.
- code: OB1402.040
  message: Your organisation is not the CT Controller. The current CT Controller is {CT Controller on Title}.
  cause: The Principal Subscriber creates a workspace in the role of CT controller. Now if the ABN of the CT controller
    on title is not the same as the ABN of the Principal Subscriber then PEXA Exchange will return this exception
    through the Initiate Workspace Creation API.
  remediation: Verify the ABN of the Subscriber and the CT Controller on Title or Panel Masters and ensure that
    they are the same value before invoking the Initiate Workspace Creation API.
- code: OB1402.041
  message: Your organisation or any of your panel master is not the CT Controller. The current CT Controller is
    {CT Controller on Title}.
  cause: If a representative subscriber creates a workspace in the role of CT controller and if the ABN of the CT
    controller on title is not the same as the ABN of the subscriber or the ABN of one of the panel masters of the
    subscriber, PEXA Exchange will return this exception through the Initiate Workspace Creation API.
  remediation: Verify the ABN of the Subscriber, CT Controller on Title or Panel Masters and ensure that they are
    the same value before invoking the Initiate Workspace Creation API.
- code: OB1402.042
  message: All the titles in the workspace should have the same CT controller
  cause: If the subscriber (principle or representative) creates a workspace in the role of CT controller with more
    than 1 title and if the ABN of the CT controller on all titles added is not the same, PEXA Exchange will return
    the exception through the Initiate Workspace Creation API.
  remediation: Verify the ABN of the CT Controller on Title is the same value for all titles before invoking the
    Initiate Workspace Creation API.
- code: OB1403.001
  message: The subscriber is not acting in the role specified
  cause: 'You are trying to retrieve workspace data for a different role to which you are acting in the workspace
    within your Retrieve Workspace Summary API request. Example: You created the workspace in the role ''Incoming
    Mortgagee'' but within the Retrieve Workspace Summary API request subscriberRole = ''Mortgagee on Title'''
  remediation: 'Within your Retrieve Workspace Summary API request ensure the value provided for the subscriberRole
    field represents the role in which you are acting in the workspace. Example: You created the workspace in the
    role ''Incoming Mortgagee'' and within the Retrieve Workspace Summary API subscriberRole=''Incoming Mortgagee''.'
- code: OB1403.002
  message: The workspace number could not be found for the subscriber user
  cause: Within your Retrieve Workspace Summary API request you have provided a workspace ID that does not exist.
  remediation: You need to create a workspace using the Initiate Workspace Creation API or via the PEXA Exchange
    manually. Then within your Retrieve Workspace Summary API request ensure that the value you pass to the workspaceid
    field is a valid Workspace id that exists in PEXA Exchange.
- code: OB1403.003
  message: The Subset value is missing 'events'
  cause: The lastEventId and Subset has been provided in the Retrieve Workspace Summary API, however Subset does
    not contain the value 'events'.
  remediation: Provide the value 'events' in the Subset field within the Retrieve Workspace Summary API request.
- code: OB1404.001
  message: The subscriber organisation name was not found
  cause: The value provided for the SubscriberId field while using Mutual TLS is not valid within the Retrieve Outstanding
    Invitations API request.
  remediation: If using Mutual TLS, provide a valid vale for the SubscriberId field within the Retrieve Outstanding
    Invitations API request.
- code: OB1405.002
  message: The workspace number could not be found for the subscriber user
  cause: The Subscriber does not have access to the workspace based on their workgroup permissions within PEXA Exchange.
    Workgroups are based on the rules set up by the administrator or the manager. If the user is not permitted to
    access the workspace number provided, then this exception will be generated.
  remediation: Check the value of the Workspace Id field within the Initiate Workspace Update API request. Ensure
    that you have permissions to the workspace and the related workgroup. If not contact the PEXA Administrator
    within your organisation.
- code: OB1405.004
  message: The party must be in the same role as the subscriber
  cause: Within the Initiate Workspace Update API request, the value for Subscriber Role is not the same as Party
    Role.
  remediation: Check the value of the Subscriber Role and Party Role fields in the Initiate Workspace Update API.
    Ensure that the values are the same for both fields.
- code: OB1405.006
  message: The party is already represented by another subscriber
  cause: You are attempting to represent a party that is already represented by another subscriber within your Initiate
    Workspace Update API request
  remediation: Within your Initiate Workspace Update API request update the value for the representing party field
    to 'No'.
- code: OB1405.007
  message: The party was not found
  cause: Within your Initiate Workspace Update API, the value for the Party Action Type field is set to 'Update'
    and the value for Party Id cannot be found in the PEXA Exchange.
  remediation: Within your Initiate Workspace Update API request provide a valid value for the Party Id field when
    the value for the Party Action Type field is set to 'Update'.
- code: OB1405.009
  message: The party type must be populated
  cause: Within your Initiate Workspace Update API request you have not provided the party type.
  remediation: 'Within your Initiate Workspace Update API request, provide a value for the party type field. Example:
    <PartyType>Individual</PartyType>'
- code: OB1405.010
  message: The party role must be populated
  cause: You have not provided a value for the party role field within your Initiate Workspace Update API request.
  remediation: 'Within your Initiate Workspace Update API request, provide a value for the party role field. Example:
    <PartyRole>Incoming Proprietor</PartyRole>'
- code: OB1405.012
  message: The party full name must be populated for the selected party type
  cause: Within your Initiate Workspace Update API request, you have not provided a value for the full name field.
  remediation: Try calling the Initiate Workspace Update API again with a value for the full name field.
- code: OB1405.013
  message: The business structure must not be provided for the selected party type
  cause: Within your Initiate Workspace Update API request you have selected party type 'individual' but provided
    business details.
  remediation: Within your Initiate Workspace Update API request, update the value for the party type field to 'Organisation'
    if you intend to use the business details.
- code: OB1405.014
  message: The business structure must be provided for the selected party type
  cause: You have not provided business details even though you have provided a value of 'Organisation' to the party
    type field within your Initiate Workspace Update API request.
  remediation: Provide business details for the organisation in your Initiate Workspace Update API request.
- code: OB1405.015
  message: The party full name must not be populated for the selected party type
  cause: You have provided the full name of an individual even though you have provided a value of 'Organisation'
    to the party type field within your Initiate Workspace Update API request.
  remediation: Try calling the Initiate Workspace Update API after removing the value for the full name field.
- code: OB1405.018
  message: The administrator status must be populated when organisation type is 'Registered company in external
    administration'
  cause: Within your Initiate Workspace Update API request, the organisation type is 'Registered company in external
    administration' and the administration status has not been populated.
  remediation: Populate the administration status field within the Initiate Workspace Update API request.
- code: OB1405.019
  message: The date of birth must be populated for represented party
  cause: Within your Initiate Workspace Update API request, the party type is 'Individual' and the date of birth
    has not been populated.
  remediation: Populate the date of birth within your Initiate Workspace Update API request.
- code: OB1405.066
  message: The workspace is in a status that does not allow it to be updated
  cause: Within your Initiate Workspace Update API request, you are trying to update a workspace Id that is already
    locked for settlement and has a workspace status of 'ready, ready'.
  remediation: Try using a workspace Id that is not locked for settlement and has a workspace status of 'in preparation'
    within your Initiate Workspace Update API request.
- code: OB1405.067
  message: The identifier must be populated for the represented party
  cause: Within your Initiate Workspace Update API request, the party type is 'Organisation' and the identifier
    field is not populated.
  remediation: Within the Initiate Workspace Update API request, provide the identifier for the 'Organisation' i.e.
    ABN, ACN, ARBN,
- code: OB1405.071
  message: A Principal Subscriber cannot create a Represented Party
  cause: Within your Initiate Workspace Update API request your Role is 'Principal Subscriber' and Representing
    Party is set to 'Yes'.
  remediation: Within your Initiate Workspace Update API request, update the Representing Party field to 'No'.
- code: OB1405.072
  message: The organisation type must be populated for the selected party type
  cause: You have not provided a value for the Organisation Type field for the selected Party Type within the Initiate
    Workspace Update API request
  remediation: The Organisation Type field is a mandatory field based on the value provided in the Party Type field.
    To resolve the current exception, provide a value for Organisation Type within the request to the Initiate Workspace
    Update API.
- code: OB1405.082
  message: The party id must be populated when an existing party is updated
  cause: Within your Initiate Workspace Update API request, the Party Id field should not be left empty if the value
    for the Party Action Type field is set to 'Update'
  remediation: Within your Initiate Workspace Update API request provide a valid value for the Party Id field when
    the value for the Party Action Type field is set to 'Update'.
- code: OB1405.083
  message: The party id must not be populated when a new party is added
  cause: You have provided a value for the Party Id field within your Initiate Workspace Update API when the value
    for the Party Action Type field is set to 'Create'.
  remediation: Within your Initiate Workspace Update API request leave the Party Id field blank when creating a
    new party.
- code: OB1405.085
  message: The Party Capacity Type must not be populated for the Party Role
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Party Role field
    has a value of ''Proprietor on Title'' or ''Incoming Proprietor'' The request is made to a workspace that has
    a jurisdiction of VIC A value has been provided to the Party Capacity Type field'
  remediation: 'A value to the Party Capacity field should only be provided when: The Party Role field has a value
    other than ''Proprietor on Title'' or ''Incoming Proprietor'' The request is made to a workspace that has a
    jurisdiction other than VIC To resolve the current exception, remove the Party Capacity Type within the request
    to the Initiate Workspace Update API keeping everything else constant.'
- code: OB1405.089
  message: The Trustee Details must not be populated for the Party Role
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Party Role field
    has a value of ''Proprietor on Title'' or ''Incoming Proprietor'' The request is made to a workspace that has
    a jurisdiction of WA A value has been provided to the Trust Details field'
  remediation: 'A value to the Trust Details field should only be provided when: * The Party Role field does not
    have a value of ''Proprietor on Title'' or ''Incoming Proprietor'' * The request is made to a workspace that
    has a jurisdiction other than WA To resolve the current exception, remove Trust Details within the request to
    the Initiate Workspace Update API keeping everything else constant.'
- code: OB1405.091
  message: The Trust Name must be populated
  cause: You have not provided a value for the Trust Name field even though you have set the value of the Trust
    Indicator field to 'Yes' within your Initiate Workspace Update API request.
  remediation: Provide a value to the Trust Name field within your Initiate Workspace Update API request.
- code: OB1405.094
  message: The Foreign Party Indicator must not be populated for the Party Role
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Party Role field
    has a value of ''Incoming Proprietor'' The request is made to a workspace that has a jurisdiction of QLD A value
    has been provided to the Foreign Party Indicator field'
  remediation: 'A value to the Foreign Party Indicator field should only be provided when: The Party Role field
    does not have a value of ''Incoming Proprietor'' The request is made to a workspace that has a jurisdiction
    other than QLD To resolve the current exception, remove the Foreign Party Indicator field within the request
    to the Initiate Workspace Update API keeping everything else constant.'
- code: OB1405.096
  message: The Foreign Party Type must be populated for Foreign Party
  cause: You have not provided a value for the Foreign Party Type field even though you have set the value of the
    Foreign Party Indicator field to 'Yes' with your Initiate Workspace Update API request.
  remediation: 'Provide a value to the Foreign Party Type field within your Initiate Workspace Update API request.
    Example: <ForeignPartyType>Wholly Foreign Company</ForeignPartyType>'
- code: OB1405.097
  message: The Foreign Party Type is invalid for a Party Type of Organisation
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Foreign Party
    Indicator field has a value of ''Yes'' The Foreign Party Type field has a value of ''Natural Person'' The Party
    Type field has a value of ''Organisation'''
  remediation: Within your Initiate Workspace Update API request ensure that you provide a value other than 'Natural
    Person' to the Foreign Party Type field.
- code: OB1405.098
  message: The Foreign Party Type is invalid for a Party Type of Individual
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Foreign Party
    Indicator field has a value of ''Yes'' The Foreign Party Type field has a value other than ''Natural Person''
    The Party Type field has a value of ''Individual'''
  remediation: Within your Initiate Workspace Update API request ensure that you provide a value of 'Natural Person'
    to the Foreign Party Type field.
- code: OB1405.100
  message: The Foreign Country must be populated for Foreign Party
  cause: You have not provided a value for the Foreign Country field even though you have set the value for the
    Foreign Party Indicator field to 'Yes' within your request to the Initiate Workspace Update API.
  remediation: Provide a value to the Foreign Country field within your Initiate Workspace Update API request.
- code: OB1405.102
  message: The Resident Party Indicator must be populated for Party Type
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Party Type field
    has a value of ''Individual'' The Party Role field has a value of ''Incoming Proprietor'' The request is made
    to a workspace that has a jurisdiction of QLD A value has not been provided for the Resident Party Indicator
    field'
  remediation: Update the value for the Resident Party Indicator field to 'Yes' within your Initiate Workspace Update
    API request.
- code: OB1405.104
  message: The Foreign Country Share must be populated for Foreign Party
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Foreign Party
    Indicator field has a value of ''Yes'' The Party Type field has a value of ''Organisation'' A value has not
    been provided for the Foreign Country Share field'
  remediation: 'Within your Initiate Workspace Update API request ensure that the foreign country share field has
    been populated. Example: <ForeignCountryShare> <ForeignShareholderCountry>AD</ForeignShareholderCountry><ForeignPercent>0</ForeignPercent>
    </ForeignCountryShare>'
- code: OB1405.108
  message: The total Foreign Shareholders Percentages must sum to 100%
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Foreign Party
    field has a value of ''Wholly Foreign Company'' The ''Shareholder Percent'' of all shareholders in the foreign
    country share is less than a total of 100%.'
  remediation: Within your Initiate Workspace Update API request ensure that the Foreign Percent totals to 100%
    across all shareholders.
- code: OB1405.109
  message: The Resident Party Indicator must not be populated for Party Type
  cause: 'The request to the Initiate Workspace Update API has the following characteristics: The Resident Party
    Indicator field is populated The Party Type field has a value other than ''Individual'' The request is made
    to a workspace that has a jurisdiction of QLD'
  remediation: Remove the Resident Party Indicator value within your Initiate Workspace Update API request.
- code: OB1405.110
  message: The Foreign Country Share must not be populated for Party Type
  cause: You have provided a value for the Foreign Country Share field while the value for the Party Type field
    is 'Organisation' within your Initiate Workspace Update API request.
  remediation: Within your Initiate Workspace Update API request, remove the foreign country share field OR update
    the value for the Party Type field and keep the Foreign Country Share information.
- code: OB1405.111
  message: The Foreign Party parameters must not be populated if Foreign Party Indicator is No
  cause: Within your Initiate Workspace Update API request your foreign party indicator field is set to 'No' and
    the following fields are populated; Foreign Party Type , Foreign Country , Resident Party Indicator , Foreign
    Country Share .
  remediation: If you need to add a foreign party, update the foreign party indicator field to 'Yes' within your
    Initiate Workspace Update API request. If you do not need to add a foreign party remove the values in the following
    fields; Foreign Party Type , Foreign Country , Resident Party Indicator , Foreign Country Share .
- code: OB1405.116
  message: The subscriber is not authorised to represent this party as they are not a panel member of this legal
    entity
  cause: The Representative Subscriber is representing a party that is not identified as a Panel Member of any 'Eligible
    Transacting Party Subscribers' of the Party record
  remediation: Verify that the Representative Subscriber has a Legal Entity Name that matches the Legal Entity Name
    of any FI Subscriber in PEXA that is associated to their Panel Master.
- code: OB1405.119
  message: The proprietor on title party <party id> cannot be updated with a party type of 'Organisation'
  cause: The request to the Initiate Workspace Update API has the following characteristics * Subscriber is in the
    role of 'Proprietor on Title' * The Party Type field has a value of 'Organisation'
  remediation: Change the value of Party Type to 'Individual'
- code: OB1405.120
  message: The proprietor on title party <party id> cannot be updated as the full name details provided differ to
    what is currently captured in PEXA
  cause: The Proprietor on Title name does not match the legal entity name in PEXA.
