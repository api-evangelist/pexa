format: proprietary
note: 'PEXA does not use RFC 9457 application/problem+json. Two distinct, published, dotted error-code registries
  exist: the Exchange business-rule exception codes (OB<nnnn>.<nnn>) returned by PEXA Exchange when a business-rule
  validation fails through either the UI or the API, and the Notification Service codes (GA.NOTIF.<httpstatus><nnn>).
  Codes and remediation text are captured verbatim from the developer portal.'
registries:
- id: exchange-exceptions
  name: PEXA Exchange API exceptions
  pattern: OB<nnnn>.<nnn> (also OB<nnn>.<nnn> and OB<nnnn>.F<n>.<nnn> variants)
  apis:
  - PEXA Exchange API
  docs: https://developer.pexa.com.au/Exchange/docs/documentation/
  count: 135
  guidance: PEXA advises integrators to surface a meaningful message to the end user rather than passing the raw
    code and message through.
- id: notification-errors
  name: PEXA Notification Service errors
  pattern: GA.NOTIF.<http-status><nnn>
  apis:
