versioning:
  scheme: uri-path
  note: >-
    Every PEXA API versions in the URI path, and versions are per-operation rather than per-document.
    The current Exchange Swagger 2.0 contract spans /v2 through /v6 SIMULTANEOUSLY in one document
    (e.g. GET /v2/health, GET /v3/user, PUT /v4/workspace, POST /v5/workspace,
    GET /v6/subscriber/workspaces) — there is no single "current API version" for Exchange. Release
    trains (R.<major>.<minor>.<patch>) version the platform, not the URI.
  current:
    exchange: mixed /v2-/v6 in one contract (release train R.24.01.00)
    projects: /v4
    notification_service: /v1, /v2, /v3 concurrently
    standalone_discharge: /v1
    marketplace: /api/plus/v1
  changelog: https://developer.pexa.com.au/Exchange/docs/changelog/
  spec_by_release: >-
    The portal states the OpenAPI spec for a particular release can be downloaded from the CHANGELOG
    menu, so historical contracts are retrievable per release.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No RFC 8594 Sunset/Deprecation header support is documented and no written deprecation or
    end-of-life policy was found on the developer portal, pexa.com.au or the API pricing page. In
    practice superseded versions are left in place alongside their successors (the Exchange contract
    still serves /v2 next to /v6; the Notification Service serves /v1, /v2 and /v3 concurrently), and
    breaking changes are announced only in prose in the per-product changelog — for example release
    R.24.00.01 changed the Workspace Title DELETE endpoint from a request body to required query
    parameters and restructured its response schema.
  deprecated_operations: []
  deprecated_operations_note: No operation in any of the seven harvested contracts carries deprecated true.
  superseded_contracts:
  - file: openapi/pexa-exchange-api-legacy-swagger.json
    note: >-
      Earlier generation of the Exchange API on /v1-/v3 paths, still shipped in the portal build.
      Not the authoritative Exchange contract; retained for provenance.
  - file: openapi/pexa-plus-marketplace-b2b-api-oas300-openapi.yaml
    note: OpenAPI 3.0.0 variant of the same Marketplace document that is also published as 3.0.3.
status_page: https://status.pexa.com.au/
