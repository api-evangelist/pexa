  help_centre: https://help.pexa.com.au/s/
  contact: https://www.pexa.com.au/contact-us/
regulatory:
  regime: ARNECC Model Operating Requirements (Electronic Conveyancing National Law)
  obligation: >-
    Per https://www.pexa.com.au/api-pricing/, PEXA Exchange APIs must be available to all third
    parties for integration on an equivalent basis to other parties of the same type, level or class,
    covering technical availability, permitted purpose, use, fees and access processes. The gate is
    obligatorily even-handed; it is not open.
